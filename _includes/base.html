<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ title | default: "Plaintext BFN" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --bg: #f4f4f5;
      --text: #18181b;
      --muted: #71717a;
      --accent: #27272a; 
      --border: #e4e4e7;
    }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 1.05rem;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    header {
      margin-bottom: 3rem;
    }

    h1 {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                   "Liberation Mono", "Courier New", monospace;
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    section {
      margin-bottom: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    p {
      margin-bottom: 1.25rem;
    }

    ul {
      padding-left: 1.2rem;
    }

    li {
      margin-bottom: 0.5rem;
    }

    .example {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                   "Courier New", monospace;
      background: #ffffff;
      border: 1px solid var(--border);
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      border-radius: 4px;
    }

    footer {
      margin-top: 4rem;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    
    a:hover {
      color: #000;
    }
  </style>
</head>

<body>
  <div class="container">
    
    <!-- This renders whatever Markdown or HTML content belongs to the specific page -->
    {{ content | raw }}

    <footer>
      © Plaintext BFN · Sole Proprietorship · Canada
    </footer>

  </div>
</body>
</html>
